<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تولدت مبارک زهرا خانومییییی ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- کتابخانه کنفتی (کاغذ رنگی) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-deep: #0b1329;
            --cream: #f4f1ea;
            --sage-green: #7a9a85;
            --accent-pink: #e8a598;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-deep);
            color: var(--cream);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 1s ease, color 1s ease;
        }

        /* حالت روشن و پرژوروبرق بعد از کلیک */
        body.surprise-active {
            background-color: #ffffff;
            color: #2c3531;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 800;
        }

        p.subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* بخش موزیک پلیر */
        .music-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }

        body.surprise-active .music-box {
            background: rgba(122, 154, 133, 0.1);
            border-color: var(--sage-green);
        }

        audio {
            width: 100%;
            max-width: 300px;
            outline: none;
        }

        /* دکمه سورپرایز اصلی */
        .surprise-btn {
            background-color: var(--sage-green);
            color: #fff;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
            margin-bottom: 50px;
            font-family: 'Vazirmatn', sans-serif;
        }

        .surprise-btn:hover {
            transform: scale(1.05);
            background-color: #638270;
        }

        /* گالری عکس‌ها */
        .gallery-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .photo-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .photo-card:hover {
            transform: translateY(-5px);
        }

        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تولدت مبارک زهرا خانومی! ✨🎉</h1>
        <p class="subtitle">این صفحه رو فقط برای تو و خاطرات قشنگمون ساختم...</p>

        <!-- موزیک پلیر -->
        <div class="music-box">
            <p style="margin-bottom: 10px; font-size: 0.9rem;">🎵 موزیک اختصاصی تولد:</p>
            <audio controls>
                <source src="my-song.mp3" type="audio/mpeg">
                مرورگر شما از پخش صوت پشتیبانی نمی‌کند.
            </audio>
        </div>

        <div>
            <br>
            <!-- دکمه جذاب برای شروع افکت‌ها -->
            <button class="surprise-btn" onclick="triggerSurprise()">بزن روی این کلیک کن! 🎁</button>
        </div>

        <h2 class="gallery-title">لحظه‌های قشنگ ما 📸</h2>
        
        <!-- گالری عکس‌ها (از photo1 تا photo20) -->
        <div class="gallery" id="galleryGrid">
            <!-- عکس‌ها به‌صورت خودکار توسط جاوااسکریپت اینجا درج میشن -->
        </div>
    </div>

    <script>
        // به صورت خودکار عکس‌ها رو از photo1 تا photo20 به گالری اضافه می‌کنه
        const grid = document.getElementById('galleryGrid');
        for (let i = 1; i <= 20; i++) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.innerHTML = `<img src="photo${i}.jpg" alt="خاطره ${i}" loading="lazy">`;
            grid.appendChild(card);
        }

        // تابع اجرای افکت کاغذ رنگی و تغییر رنگ صفحه
        function triggerSurprise() {
            document.body.classList.toggle('surprise-active');
            
            // پخش افکت کنفتی
            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
